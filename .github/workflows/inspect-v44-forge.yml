name: Inspect V44 Forge downloader
on:
  push:
    branches: [fix/v44-star-trek-release]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Fetch V44 installer
        run: git lfs pull --include='Jadons Ultimate Installer v44 Beta.cmd' --exclude=''
      - name: Inspect version handling and compatibility fingerprints
        shell: python
        run: |
          import re,io,zipfile,base64
          from pathlib import Path
          p=Path("Jadons Ultimate Installer v44 Beta.cmd")
          head=p.open("rb").read(1000000)
          m=re.search(rb"###JADON_V32_PACK_BEGIN###\r?\n(.*?)###JADON_V32_PACK_END###",head,re.S)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(m.group(1)))) as z:
              lines=z.read("engine.cmd").decode("utf-8","replace").splitlines()
          for first,last in ((905,965),(994,1060),(9100,9190),(9380,9490),(9548,9667)):
              print("SECTION",first,last)
              for j in range(first-1,last):
                  if j>=len(lines):break
                  v=lines[j]
                  if len(v)>350:v=v[:350]+"...[truncated]"
                  print(f"CODE {j+1}: {v}")
