name: Inspect V44 Forge downloader
on:
  push:
    branches: [fix/v44-star-trek-release]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, persist-credentials: false}
      - run: git lfs pull --include='Jadons Ultimate Installer v44 Beta.cmd' --exclude=''
      - name: Inspect snapshot record writing and source commit usage
        shell: python
        run: |
          import re,io,zipfile,base64
          from pathlib import Path
          head=Path("Jadons Ultimate Installer v44 Beta.cmd").open("rb").read(1000000)
          m=re.search(rb"###JADON_V32_PACK_BEGIN###\r?\n(.*?)###JADON_V32_PACK_END###",head,re.S)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(m.group(1)))) as z: lines=z.read("engine.cmd").decode("utf-8","replace").splitlines()
          for i in range(9667-1,9750):
              print(f"CODE {i+1}: {lines[i][:350]}")
          for i,line in enumerate(lines):
              if "$sourceCommit" in line or "snapshotAiSources" in line:
                  print("REFERENCE",i+1,line[:300])
