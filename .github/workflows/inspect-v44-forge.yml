name: Inspect V44 Forge downloader
on:
  push:
    branches:
      - fix/v44-star-trek-release
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Fetch only V44 package
        run: git lfs pull --include='Jadons Ultimate Installer v44 Beta.cmd' --exclude=''
      - name: Inspect installer engine and Hold The Line compatibility (read-only)
        shell: python
        run: |
          from pathlib import Path
          import re,base64,zipfile,io,json
          p=Path("Jadons Ultimate Installer v44 Beta.cmd")
          with p.open("rb") as f: head=f.read(1000000)
          m=re.search(rb"###JADON_V32_PACK_BEGIN###\r?\n(.*?)###JADON_V32_PACK_END###",head,re.S)
          if not m: raise RuntimeError("Installer engine was not found")
          engine_zip=base64.b64decode(m.group(1))
          with zipfile.ZipFile(io.BytesIO(engine_zip)) as z:
              print("ENGINE ZIP",z.namelist())
              engine=z.read("engine.cmd")
          print("ENGINE LENGTH",len(engine))
          text=engine.decode("utf-8","replace")
          lines=text.splitlines()
          print("ENGINE LINE COUNT",len(lines))
          print("ENGINE FIRST 65",repr("\n".join(f"{i+1}: {l}" for i,l in enumerate(lines[:65])))[:9000])
          seen=set()
          patterns=("forge","snapshot","install-forge","forgeversion","forge_version","releases/latest","forge-2.0","forge.zip","forge.jar")
          indices=[i for i,l in enumerate(lines) if any(q in l.lower() for q in patterns)]
          print("ENGINE MATCH COUNT",len(indices))
          for i in indices[:180]:
              if i in seen:continue
              lo=max(0,i-2);hi=min(len(lines),i+4)
              print("ENGINE_CONTEXT",i+1,repr("\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi)))[:3500])
              seen.add(i)
          data=p.read_bytes()
          offset=int(re.search(rb"V32_HOLD_OFFSET=(\d+)",head).group(1))
          decoded=base64.b64decode(data[offset:].strip())
          with zipfile.ZipFile(io.BytesIO(decoded)) as z:
              for n in ("bundle-manifest.json","package.json","forge-bridge.mjs","forge-workspace.js"):
                  print("HOLD FILE",n)
                  val=z.read(n).decode("utf-8","replace")
                  if n.endswith(".json"):
                      try:
                          js=json.loads(val)
                          if n=="bundle-manifest.json": print("MANIFEST TOP",list(js.keys()));print("MANIFEST META",str({k:v for k,v in js.items() if k not in ("files","entries","assets","checksums")})[:7000])
                          else:print("PACKAGE JSON",val[:5000])
                      except:print(val[:1500])
                  else:
                      ls=val.splitlines()
                      hits=[i for i,l in enumerate(ls) if any(q in l.lower() for q in ("forge version","forge-version","version", "card-forge","releases","snapshot","forge bridge","forge.exe","forge.jar"))]
                      print("HOLD MATCH COUNT",len(hits))
                      for i in hits[:60]:
                          lo=max(0,i-1);hi=min(len(ls),i+3)
                          print("HOLD_CONTEXT",n,i+1,repr("\n".join(f"{j+1}: {ls[j]}" for j in range(lo,hi)))[:1400])
