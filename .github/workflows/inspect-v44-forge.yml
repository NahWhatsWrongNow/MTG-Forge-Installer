name: Inspect V44 Forge downloader
on:
  push:
    branches:
      - fix/v44-star-trek-release
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Fetch only V44 package
        run: git lfs pull --include='Jadons Ultimate Installer v44 Beta.cmd' --exclude=''
      - name: Inspect embedded Hold The Line payload (read-only)
        shell: python
        run: |
          import re,io,base64,zipfile,hashlib,sys
          from pathlib import Path
          p=Path("Jadons Ultimate Installer v44 Beta.cmd")
          with p.open("rb") as f:
              head=f.read(1000000)
              print("HEADER_START",repr(head[:6800]))
              m=re.search(rb'V32_HOLD_OFFSET=(\d+)',head)
              if not m: raise RuntimeError("missing embedded-payload marker")
              offset=int(m.group(1))
              print("OFFSET",offset,"BEFORE",repr(head[offset-120:offset]),"AFTER",repr(head[offset:offset+120]))
              f.seek(offset)
              encoded=f.read().strip()
              print("ENCODED",len(encoded),"ALPHABET",repr(sorted(set(encoded)-set(b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n"))[:30]))
          try:
              decoded=base64.b64decode(encoded)
              print("DECODED",len(decoded),repr(decoded[:64]),repr(decoded[-40:]))
              print("ZIP",zipfile.is_zipfile(io.BytesIO(decoded)))
              with zipfile.ZipFile(io.BytesIO(decoded)) as z:
                  names=z.namelist()
                  print("FILES COUNT",len(names))
                  print("FILES FIRST",names[:80])
                  interesting=[(n,z.getinfo(n).file_size) for n in names if any(q in n.lower() for q in ("forge","hold","plugin","installer","support","bridge","manifest","setup"))]
                  print("INTERESTING",repr(interesting[:220])[:24000])
                  for n in names:
                      if n.lower().endswith((".cmd",".bat",".ps1",".json",".txt",".ini",".py")) and (any(q in n.lower() for q in ("forge","hold","plugin","installer","manifest","setup","support","bridge")) or n.lower() in ("bundle-manifest.json","engine.cmd")):
                          info=z.getinfo(n)
                          if info.file_size>500000:continue
                          try:
                              t=z.read(n).decode("utf-8","replace")
                              matches=[l for l in t.splitlines() if any(q in l.lower() for q in ("forge", "snapshot", "hold the line", "release", "version", "github", "plugin", "install"))]
                              print("FILE",n,"BYTES",info.file_size,"MATCHES",len(matches),repr("\n".join(matches[:80]))[:14000])
                          except Exception as ex: print("ERROR",n,repr(ex))
          except Exception as ex:
              print("UNPACK_ERROR",type(ex).__name__,str(ex))
              raise
