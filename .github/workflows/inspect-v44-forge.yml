name: Patch V44 Hold The Line Forge release
on:
  push:
    branches: [fix/v44-star-trek-release]
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
      - name: Fetch only V44 Beta installer
        shell: bash
        run: git lfs pull --include='Jadons Ultimate Installer v44 Beta.cmd' --exclude=''
      - name: Pin compatibility install to verified Star Trek 2.0.16
        shell: bash
        run: |
          python - <<'PY'
          import base64, difflib, hashlib, io, re, zipfile, textwrap
          from pathlib import Path
          path=Path("Jadons Ultimate Installer v44 Beta.cmd")
          data=path.read_bytes()
          old_offset_match=re.search(rb'set "V32_HOLD_OFFSET=(\d{12})"',data[:2048])
          assert old_offset_match is not None, "Missing fixed-size payload offset"
          old_offset=int(old_offset_match.group(1))
          old_prefix=data[:old_offset]
          untouched_hold=data[old_offset:]
          assert old_prefix.endswith(b"###JADON_V32_HOLD_DATA###\r\n"), "Unexpected package layout"
          marker_start=b"###JADON_V32_PACK_BEGIN###\r\n"
          marker_end=b"###JADON_V32_PACK_END###\r\n"
          begin=old_prefix.index(marker_start)+len(marker_start)
          end=old_prefix.index(marker_end)
          pack_encoded=old_prefix[begin:end]
          old_zip_bytes=base64.b64decode(pack_encoded)
          old_zip_sha=hashlib.sha256(old_zip_bytes).hexdigest()
          expected_zip=re.search(rb'set "V32_ZIP_SHA=([a-f0-9]{64})"',old_prefix[:2000]).group(1).decode()
          assert old_zip_sha==expected_zip, "Original package ZIP does not validate"
          with zipfile.ZipFile(io.BytesIO(old_zip_bytes),"r") as orig:
              assert orig.namelist()==["engine.cmd"], "Unexpected engine ZIP"
              entry=orig.getinfo("engine.cmd")
              old_engine=orig.read("engine.cmd")
              old_comment=orig.comment
          old_engine_sha=hashlib.sha256(old_engine).hexdigest()
          expected_engine=re.search(rb'set "V32_ENGINE_SHA=([a-f0-9]{64})"',old_prefix[:2000]).group(1).decode()
          assert old_engine_sha==expected_engine, "Original engine checksum does not validate"
          before_overlay=re.search(rb"###JADON_HTL_SUPPORT_BEGIN###\r?\n(.*?)###JADON_HTL_SUPPORT_END###",old_engine,re.S)
          assert before_overlay is not None, "Hold The Line overlay code missing"
          substitutions=[
              (b"if($Metadata.tag_name-ne'daily-snapshots'-or$Metadata.draft){throw 'Expected the official daily-snapshots release.'}",
               b"if($Metadata.tag_name-ne'forge-2.0.16'-or$Metadata.draft){throw 'Expected the official Star Trek release.'}"),
              (rb"$assets=@($Metadata.assets|Where-Object {$_.name-match'^forge-installer-\d+(?:\.\d+){1,3}-SNAPSHOT(?:-[0-9.]+)?\.jar$'})",
               b"$assets=@($Metadata.assets|Where-Object {$_.name-ceq 'forge-installer-2.0.16.jar'})"),
              (rb"if($asset.name-notmatch'^forge-installer-((\d+(?:\.\d+){1,3}-SNAPSHOT)(?:-[0-9.]+)?)\.jar$'){throw 'Invalid snapshot filename.'}",
               b"if([string]$asset.name-cne'forge-installer-2.0.16.jar'){throw 'Invalid Star Trek installer filename.'}"),
              (b"$artifactVersion=$Matches[1];$version=$Matches[2]",
               b"$artifactVersion='2.0.16';$version='2.0.16'"),
              (b"$expected='https://github.com/Card-Forge/forge/releases/download/daily-snapshots/'+$asset.name",
               b"$expected='https://github.com/Card-Forge/forge/releases/download/forge-2.0.16/'+$asset.name"),
              (b";Tag='daily-snapshots'}",
               b";Tag='forge-2.0.16'}"),
              (b"Get-SnapshotJson 'https://api.github.com/repos/Card-Forge/forge/releases/tags/daily-snapshots'",
               b"Get-SnapshotJson 'https://api.github.com/repos/Card-Forge/forge/releases/tags/forge-2.0.16'")
          ]
          new_engine=old_engine
          for old,new in substitutions:
              count=new_engine.count(old)
              assert count==1,(f"Expected one occurrence, got {count}: {old[:100]!r}")
              new_engine=new_engine.replace(old,new,1)
          after_overlay=re.search(rb"###JADON_HTL_SUPPORT_BEGIN###\r?\n(.*?)###JADON_HTL_SUPPORT_END###",new_engine,re.S)
          assert after_overlay is not None and before_overlay.group(1)==after_overlay.group(1), "Compatibility plugin code changed"
          changes=list(difflib.unified_diff(old_engine.decode("utf-8").splitlines(),new_engine.decode("utf-8").splitlines(),lineterm="",n=1))
          assert len(changes)<80, "Unexpectedly broad change"
          print("ONLY INSTALLER ENGINE DIFF:")
          for row in changes: print(row)
          out=io.BytesIO()
          with zipfile.ZipFile(out,"w",compression=entry.compress_type,compresslevel=9) as dest:
              dest.comment=old_comment
              dest.writestr(entry,new_engine,compress_type=entry.compress_type,compresslevel=9)
          new_zip_bytes=out.getvalue()
          new_zip_sha=hashlib.sha256(new_zip_bytes).hexdigest().encode()
          new_engine_sha=hashlib.sha256(new_engine).hexdigest().encode()
          encoded=base64.b64encode(new_zip_bytes)
          assert len(encoded)<=960*1024, "Encoded engine exceeds bootstrap limit"
          new_pack=b"\r\n".join(encoded[i:i+76] for i in range(0,len(encoded),76))+b"\r\n"
          new_prefix=old_prefix[:begin]+new_pack+old_prefix[end:]
          new_prefix=new_prefix.replace(b'V32_ENGINE_SHA='+old_engine_sha.encode(),b'V32_ENGINE_SHA='+new_engine_sha,1)
          new_prefix=new_prefix.replace(b'V32_ZIP_SHA='+old_zip_sha.encode(),b'V32_ZIP_SHA='+new_zip_sha,1)
          new_offset=len(new_prefix)
          assert new_offset<10**12
          new_prefix=new_prefix.replace(b'V32_HOLD_OFFSET='+f"{old_offset:012d}".encode(),b'V32_HOLD_OFFSET='+f"{new_offset:012d}".encode(),1)
          assert len(new_prefix)==new_offset
          assert re.search(rb'set "V32_HOLD_OFFSET=(\d{12})"',new_prefix[:2048]).group(1)==f"{new_offset:012d}".encode()
          verify_start=new_prefix.index(marker_start)+len(marker_start)
          verify_end=new_prefix.index(marker_end)
          decoded=base64.b64decode(new_prefix[verify_start:verify_end])
          assert hashlib.sha256(decoded).hexdigest().encode()==new_zip_sha
          with zipfile.ZipFile(io.BytesIO(decoded)) as check:
              assert check.namelist()==["engine.cmd"]
              assert check.read("engine.cmd")==new_engine
          new_data=new_prefix+untouched_hold
          assert new_data[new_offset:]==untouched_hold
          path.write_bytes(new_data)
          print("PATCHED_IN_PLACE",path)
          print("STAR_TREK_VERSION","2.0.16")
          print("REPLACEMENT_COUNT",len(substitutions))
          print("HOLD_THE_LINE_UNCHANGED_SHA256",hashlib.sha256(untouched_hold).hexdigest())
          print("ENGINE_SHA256",new_engine_sha.decode())
          print("ZIP_SHA256",new_zip_sha.decode())
          print("NEW_OFFSET",new_offset)
          print("NEW_FILE_BYTES",len(new_data))
          PY
      - name: Verify V44 bootstrap extraction on Windows
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE "Jadons Ultimate Installer v44 Beta.cmd"
          & cmd.exe /d /c ('"' + $file + '" --v44-extract')
          if ($LASTEXITCODE -ne 0) { throw "V44 bootstrap validation failed with exit code $LASTEXITCODE" }
          Write-Host "V44 Windows extraction and SHA-256 verification passed"
      - name: Commit installer change only and remove temporary inspection workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Jadons Ultimate Installer v44 Beta.cmd"
          git rm -- ".github/workflows/inspect-v44-forge.yml"
          git diff --cached --name-only
          git commit -m "fix: pin V44 Hold The Line Forge setup to compatible Star Trek 2.0.16"
          git push origin HEAD:refs/heads/fix/v44-star-trek-release
