name: Inspect V44 Forge downloader
on:
  push:
    branches:
      - fix/v44-star-trek-release
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Fetch only V44 package
        run: git lfs pull --include='Jadons Ultimate Installer v44 Beta.cmd' --exclude=''
      - name: Inspect bundle structure (read-only)
        shell: python
        run: |
          from pathlib import Path
          import zipfile, mmap, collections, sys, re
          p = Path("Jadons Ultimate Installer v44 Beta.cmd")
          print("PACKAGE SIZE", p.stat().st_size)
          with p.open("rb") as f, mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ) as mm:
              print("HEAD", repr(mm[:1800]))
              print("TAIL", repr(mm[-350:]))
              for needle in [b"PK\x03\x04", b"7z\xbc\xaf\x27\x1c", b"Rar!", b"MZ", b"forge", b"Forge", b"hold", b"Hold", b".ps1", b"plugin", b"snapshot"]:
                  offsets=[]; pos=0
                  for i in range(15):
                      pos=mm.find(needle,pos)
                      if pos<0: break
                      offsets.append(pos); pos+=len(needle)
                  print("SIGNATURE", repr(needle), offsets)
          print("IS_ZIP", zipfile.is_zipfile(p))
          if zipfile.is_zipfile(p):
              with zipfile.ZipFile(p) as z:
                  names=z.namelist()
                  print("ZIP COUNT", len(names))
                  print("ZIP FIRST", names[:60])
                  hits=[(n,z.getinfo(n).file_size) for n in names if any(s in n.lower() for s in ("forge","hold","installer","plugin","snapshot","support","manifest",".ps1",".cmd",".bat"))]
                  print("ZIP RELEVANT",hits[:220])
                  for name in names:
                      if name.lower().endswith((".cmd",".bat",".ps1",".json",".ini",".txt")) and any(s in name.lower() for s in ("installer","manifest","forge","hold","setup","config")):
                          try:
                              if z.getinfo(name).file_size>150000:continue
                              b=z.read(name)
                              t=b.decode("utf-8","replace")
                              matches=[line for line in t.splitlines() if any(x in line.lower() for x in ("forge", "snapshot", "hold the line", "releases", "version", "github", "install"))]
                              print("TEXT HITS",name,"bytes",len(b),"lines",len(matches),repr("\n".join(matches[:60]))[:10000])
                          except Exception as ex:print("ERROR",name,type(ex).__name__,str(ex)[:300])
